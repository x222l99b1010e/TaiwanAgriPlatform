version: "3.9"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -C -Q 'SELECT 1'"]
      interval: 15s
      retries: 5
      start_period: 30s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP 協議（應用程式連線用）
      - "15672:15672"   # Management UI（瀏覽器管理介面）
  # ── 已停用：web / worker 服務 ─────────────────────────────────
  # 這個 compose 檔只負責基礎設施（資料庫、Redis、RabbitMQ），.NET 應用程式跑在本機。
  # 下面兩個區塊引用的 TaiwanAgri.Web/Dockerfile 與 TaiwanAgri.Worker/Dockerfile 都還不存在，
  # 取消註解會讓 docker compose up 直接失敗。
  # 重新啟用條件：補上那兩個 Dockerfile、改成容器化啟動之後。
  # web:
  #   build:
  #     context: .
  #     dockerfile: TaiwanAgri.Web/Dockerfile
  #   environment:
  #     - RabbitMQ__HostName=rabbitmq
  #   depends_on:
  #     - rabbitmq
  #     - sqlserver
  #     - redis

  # worker:
  #   build:
  #     context: .
  #     dockerfile: TaiwanAgri.Worker/Dockerfile
  #   environment:
  #     - RabbitMQ__HostName=rabbitmq
  #   depends_on:
  #     - rabbitmq
  #     - sqlserver
  # ────────────────────────────────────────────────────────────────

volumes:
  sqlserver_data: