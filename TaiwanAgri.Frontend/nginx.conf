# 前端容器的 nginx：送出建置好的前端，並把 API 請求轉給後端容器。
# 瀏覽器只跟這一個來源講話（同源），不經過 CORS——後端以 Cors__SameOriginOnly=true 宣告這件事
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 後端在 compose 網路裡的名稱是 web。用變數＋Docker 內建的 DNS，執行時才查位址、最多記 10 秒就重查：
    # 直接寫死 proxy_pass http://web:8080 的話，nginx 只在啟動時查一次，後端容器重啟換了位址就會一直 502
    resolver 127.0.0.11 valid=10s;
    set $backend http://web:8080;

    location /api/ {
        proxy_pass $backend;
        # 前端等後端最多 120 秒（冷啟動提示的上限）；nginx 預設 60 秒就斷，對齊前端
        proxy_read_timeout 120s;
    }

    # 「伺服器喚醒中」提示會打 /health 與 /health/ready
    location /health {
        proxy_pass $backend;
    }

    # 檔名帶雜湊的資源內容不會變，可以長期快取
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端路由是 history 模式：找不到實體檔案就回 index.html，路徑交給前端判斷
    location / {
        try_files $uri $uri/ /index.html;
    }
}
