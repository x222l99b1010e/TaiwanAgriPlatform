<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 網站圖示「梯田夕陽」：柿色夕陽＋三層秧苗綠田埂，夜土底，畫的是主題名「秋田」。
       刻意畫在 16×16 的格子上：分頁上實際就是 16px，夕陽直徑 6px、田埂各 2px 厚、間隔 1px、
       弧度只拱 1px，每條邊都落在像素邊界，縮到 16px 才不會糊成色塊。
       色值對應 base.css 的原始色階：夜土 soil-900／夕陽 persimmon-400／田埂由遠到近 seed-300、400、500。
       favicon.ico 與 apple-touch-icon.png 是從這張點陣化出來的，改這張要一併重產。
       ⚠ 這段註解裡不能出現連續兩個減號（XML 註解的規定），寫了整張圖會解析失敗、分頁上沒有圖示。 -->
  <defs>
    <clipPath id="r"><rect width="16" height="16" rx="3.5"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="16" height="16" fill="#191310"/>
    <circle cx="5" cy="5" r="3" fill="#e2812e"/>
    <path d="M0 9Q8 7 16 9V11Q8 9 0 11Z" fill="#7cc3a6"/>
    <path d="M0 12Q8 10 16 12V14Q8 12 0 14Z" fill="#4fb088"/>
    <path d="M0 15Q8 13 16 15V17Q8 15 0 17Z" fill="#2f8f6b"/>
  </g>
</svg>
