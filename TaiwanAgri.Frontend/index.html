<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="整合農業部開放資料的農業資訊平台：作物與畜禽行情、農場氣象與病蟲害警報、食安追溯查詢、收容動物地圖。">

    <!-- 三套字型的唯一載入點，對應 base.css 的 --font-body（Noto Sans TC，正文）／
         --font-display（Noto Serif TC，大標題）／--font-num（Inter，拉丁字母與數字）。
         ⚠ 兩邊必須同步：base.css 新增或改動 --font-* 而這裡沒有對應載入點時，
         不會報錯、畫面也不會壞，只會安靜地退回 fallback 字型，肉眼很難察覺。
         字重只載實際用到的：Sans TC 400/500/700、Serif TC 只有大標題的 700、
         Inter 400/500/600/700。Google Fonts 依 unicode-range 分段供應，
         中文字集不會一次下載完，這是 CJK 字型優於自行 host 完整檔的主因。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">

    <title>台灣農業平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
