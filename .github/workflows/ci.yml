name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# 權杖只給讀取：這支只有建置與測試，沒有任何需要寫入 repo 的步驟。
# 不寫的話，權限取決於 repo 設定頁的預設值（可能是可寫入），2026-11 總檢查資安 B5
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 整合測試要一台真的 SQL Server（映像同 docker-compose.yml）。最先啟動，開機的十幾秒跟還原、建置重疊。
      # 密碼每一輪現場隨機產生、在記錄裡遮掉，不寫進 repo；容器跟著執行器一起消失
      - name: Start SQL Server for integration tests
        run: |
          SA_PASSWORD="It$(openssl rand -hex 16)!"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name it-sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "IT_SQL_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          echo "INTEGRATION_TEST_SQL=Server=localhost,1433;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TaiwanAgriPlatform.slnx

      - name: Build
        run: dotnet build TaiwanAgriPlatform.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TaiwanAgri.Tests/TaiwanAgri.Tests.csproj --no-build --no-restore --configuration Release --verbosity normal

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if docker exec it-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$IT_SQL_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs it-sql
          exit 1

      # 環境變數 CI=true（GitHub Actions 一律會設）時，整合測試在沒有資料庫的情況下會失敗而不是略過
      - name: Integration tests (SQL Server)
        run: dotnet test TaiwanAgri.IntegrationTests/TaiwanAgri.IntegrationTests.csproj --no-build --no-restore --configuration Release --verbosity normal

  frontend:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: TaiwanAgri.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: TaiwanAgri.Frontend
        run: npm ci

      - name: Lint
        working-directory: TaiwanAgri.Frontend
        run: npm run lint

      - name: Test
        working-directory: TaiwanAgri.Frontend
        run: npx vitest run

      - name: Build
        working-directory: TaiwanAgri.Frontend
        run: npm run build

  docker-images:
    name: Docker Images Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 只建置不推送：確認四個映像（建表、後端、Worker、前端）照 compose 的定義仍然建得起來。
      # 沒有自動化跑過的 Dockerfile，壞了也不會有人發現
      - name: Build images
        run: docker compose --profile app build
        env:
          # 建置不會讀這個值；設了只是讓 compose 不印「變數未設定」的警告
          SA_PASSWORD: not-used-at-build-time