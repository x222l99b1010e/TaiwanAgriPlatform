name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TaiwanAgriPlatform.slnx

      - name: Build
        run: dotnet build TaiwanAgriPlatform.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TaiwanAgri.Tests/TaiwanAgri.Tests.csproj --no-build --no-restore --configuration Release --verbosity normal

  frontend:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: TaiwanAgri.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: TaiwanAgri.Frontend
        run: npm ci

      - name: Lint
        working-directory: TaiwanAgri.Frontend
        run: npm run lint

      - name: Test
        working-directory: TaiwanAgri.Frontend
        run: npx vitest run

      - name: Build
        working-directory: TaiwanAgri.Frontend
        run: npm run build